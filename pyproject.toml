[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "othello-world"
version = "1.0.0"
description = "Mechanistic interpretability research on Othello-GPT"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Kenneth Li"},
    {name = "Aspen K Hopkins"},
    {name = "David Bau"},
    {name = "Fernanda Viégas"},
    {name = "Hanspeter Pfister"},
    {name = "Martin Wattenberg"},
]
keywords = ["deep-learning", "interpretability", "transformers", "othello", "mechanistic-interpretability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]

dependencies = [
    "torch>=1.8.0",
    "numpy>=1.20.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "tqdm>=4.60.0",
    "psutil>=5.8.0",
    "python-chess>=1.0.0",
    "pgn==0.1.0",
]

[project.optional-dependencies]
interpretability = [
    "transformer-lens>=1.0.0",
    "einops>=0.6.0",
    "fancy-einsum>=0.0.3",
]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]
all = [
    "transformer-lens>=1.0.0",
    "einops>=0.6.0",
    "fancy-einsum>=0.0.3",
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/likenneth/othello_world"
Repository = "https://github.com/likenneth/othello_world"
"Bug Tracker" = "https://github.com/likenneth/othello_world/issues"

[project.scripts]
othello-gui = "gui.run:main"

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
